name: EAS Submit iOS

# En son alınan iOS build'ini App Store Connect'e gönderir.
# ÖN KOŞUL (bir kereye mahsus, elle yapılması gerekir):
#   1) App Store Connect -> Users and Access -> Integrations -> Keys ("Team Keys")
#      sekmesinden "App Manager" (yetmezse "Admin") rolünde yeni bir API Key
#      oluşturun, .p8 dosyasını indirin (yalnızca 1 kere indirilebilir).
#   2) GitHub reposu -> Settings -> Secrets and variables -> Actions:
#        - ASC_API_KEY_P8   = .p8 dosyasının TÜM içeriği (BEGIN/END satırları dahil)
#        - EXPO_TOKEN       = (eas-local-build.yml'de zaten varsa aynısı kullanılır)
#   3) eas.json'daki submit.production.ios bloğuna ascApiKeyId ve
#      ascApiKeyIssuerId değerlerini eklemeniz gerekir (bunlar gizli değildir,
#      API Key sayfasında görünür) — bu adımı ben eas.json üzerinden yaparım,
#      Key ID / Issuer ID'yi bana iletmeniz yeterli.
#
# Elle tetiklemek için: GitHub reposu -> Actions -> "EAS Submit iOS" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json içindeki submit profili (API Key ile CI'da submit için production-ci kullanın)"
        required: false
        default: "production-ci"

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: EAS CLI yükle
        run: npm install -g eas-cli

      - name: App Store Connect API key dosyasını yaz
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" > asc-api-key.p8

      - name: EAS iOS submit (en son build)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform ios \
            --profile "${{ github.event.inputs.profile }}" \
            --non-interactive \
            --latest

      - name: API key dosyasını temizle
        if: always()
        run: rm -f asc-api-key.p8
